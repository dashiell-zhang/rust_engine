[package]
name = "repository_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
application_model = { path = "../application/application_model" }
common = { path = "../infrastructure/common" }
repository = { path = "../repository" }

base64 = "0.22.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
config = "0.15.22"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
sea-orm = { version = "1.1.20", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tokio = { version = "1.52.1", features = ["full"] }
