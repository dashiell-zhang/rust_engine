[package]
name = "repository_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
event_bus_database = { path = "../infrastructure/event_bus_database" }
repository_core = { path = "../infrastructure/repository_core" }
queue_task_database = { path = "../infrastructure/queue_task_database" }
logger_database = { path = "../infrastructure/logger_database" }
repository = { path = "../repository" }

clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
sea-orm = { version = "2.0.4", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = "0.4.45"
tokio = { version = "1.54.1", features = ["full"] }
