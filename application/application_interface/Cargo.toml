[package]
name = "application_interface"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
common = { path = "../../infrastructure/common" }
distributed_cache = { path = "../../infrastructure/distributed_cache" }
distributed_lock = { path = "../../infrastructure/distributed_lock" }
futures-util = "0.3"
identifier_generator = { path = "../../infrastructure/identifier_generator" }
indexmap = { version = "2", features = ["serde"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
sea-orm = { version = "2.0.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
