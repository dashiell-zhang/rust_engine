[package]
name = "source_generator_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
distributed_lock = { path = "../../infrastructure/distributed_lock" }
hybrid_cache = { path = "../../infrastructure/hybrid_cache" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
source_generator_core = { path = "../source_generator_core" }
sha2 = "0.11.0"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
