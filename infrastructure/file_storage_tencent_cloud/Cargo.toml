[package]
name = "file_storage_tencent_cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
application_interface = { path = "../../application/application_interface" }
common = { path = "../common" }

async-trait = "0.1"
hmac = "0.13.0"
percent-encoding = "2.3"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
sha1 = "0.11.0"
tokio = { version = "1.53.1", features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
