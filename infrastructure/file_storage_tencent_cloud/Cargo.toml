[package]
name = "file_storage_tencent_cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
application_runtime = { path = "../../application/application_runtime" }
application_interface = { path = "../../application/application_interface" }
common = { path = "../common" }

async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
futures-util = "0.3.34"
hmac = "0.13.0"
md5 = { package = "md-5", version = "0.11.0" }
percent-encoding = "2.3.2"
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
sha1 = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
