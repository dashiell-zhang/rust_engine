[package]
name = "sms_tencent_cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
sms = { path = "../sms" }

async-trait = "0.1"
chrono = "0.4.44"
hmac = "0.13.0"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tracing = "0.1.44"
