[package]
name = "file_storage_ali_cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
application_interface = { path = "../../application/application_interface" }
common = { path = "../common" }

async-trait = "0.1"
base64 = "0.22.1"
chrono = "0.4.44"
hmac = "0.13.0"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream"] }
sha1 = "0.11.0"
tokio = { version = "1.52.1", features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
urlencoding = "2"
