[package]
name = "file_storage_ali_cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
application_runtime = { path = "../../application/application_runtime" }
application_interface = { path = "../../application/application_interface" }
common = { path = "../common" }

async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
crc = "3.4.0"
futures-util = "0.3.34"
hmac = "0.13.0"
quick-xml = "0.42.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
