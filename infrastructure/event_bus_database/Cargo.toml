[package]
name = "event_bus_database"
version = "0.1.0"
edition = "2024"

[dependencies]
event_bus = { path = "../event_bus" }
repository_core = { path = "../repository_core" }
identifier_generator = { path = "../identifier_generator" }
async-trait = "0.1.92"
chrono = "0.4.45"
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid"] }
tokio = { version = "1.54.1", features = ["sync"] }
uuid = "1.29.0"
