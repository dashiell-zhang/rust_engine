[package]
name = "distributed_lock_redis"
version = "0.1.0"
edition = "2024"

[dependencies]
distributed_lock = { path = "../distributed_lock" }

async-trait = "0.1.92"
md-5 = "0.11.0"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["v4"] }
tracing = "0.1.44"

[dependencies.redis]
version = "1.8.1"
features = ["tokio-comp", "connection-manager"]
