[package]
name = "logger_database"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.11.1"
logger = { path = "../logger" }
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
common = { path = "../common" }
repository_core = { path = "../repository_core" }
distributed_lock = { path = "../distributed_lock" }
source_generator_core = { path = "../../source_generator/source_generator_core" }

chrono = { version = "0.4.45", features = ["serde"] }
sea-orm = { version = "2.0.4", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tokio-util = { version = "0.7.20", features = ["rt"] }
uuid = { version = "1.29.0", features = ["v4"] }
