[package]
name = "llm"
version = "0.1.0"
edition = "2024"

[dependencies]
cancellation = { path = "../cancellation" }
source_generator_core = { path = "../../source_generator/source_generator_core" }
async-stream = "0.3.6"
async-trait = "0.1.92"
futures-util = "0.3.34"
hyper = { version = "1.12.0", default-features = false, features = ["http1"] }
indexmap = { version = "2.14.2", features = ["serde"] }
mime = "0.3.18"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
