[package]
name = "logger"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.3"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
icu_casemap = "2.4.0"
notify = "8.2.1"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "registry"] }
