[package]
name = "file_storage"
version = "0.1.0"
edition = "2024"

[features]
default = ["local"]
local = ["dep:tokio"]

[dependencies]
common = { path = "../common", default-features = false }

async-trait = "0.1.92"
chrono = "0.4.45"
tokio = { version = "1.54.1", features = ["fs", "io-util"], optional = true }
