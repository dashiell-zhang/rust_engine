[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
distributed_cache = { path = "../distributed_cache" }
distributed_lock = { path = "../distributed_lock" }
identifier_generator = { path = "../identifier_generator" }

aes = "0.9.2"
aes-gcm = "0.11.0"
base64 = "0.23.1"
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
ecb = "0.2.0"
flate2 = "1.1.9"
font8x8 = "0.3.1"
hmac = "0.13.0"
html-escape = "0.2.15"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.11.0"
md5_legacy = { package = "md-5", version = "0.10.6" }
pbkdf2 = "0.13.0"
qrcode = "0.14.1"
quick-xml = { version = "0.41.0", features = ["serialize"] }
regex = "1.13.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "form", "rustls"] }
rsa = { version = "0.9.10", features = ["pem"] }
rust_xlsxwriter = "0.97.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha1_legacy = { package = "sha1", version = "0.10.7" }
sha2 = "0.11.0"
sha2_legacy = { package = "sha2", version = "0.10.9" }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
walkdir = "2.5.0"
zip = "8.6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
