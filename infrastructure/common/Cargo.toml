[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
distributed_cache = { path = "../distributed_cache" }
distributed_lock = { path = "../distributed_lock" }
identifier_generator = { path = "../identifier_generator" }

aes = "0.9.1"
aes-gcm = "0.10.3"
base64 = "0.22.1"
calamine = "0.36.0"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
ecb = "0.2.0"
flate2 = "1.1.9"
font8x8 = "0.3.1"
hmac = "0.12.1"
html-escape = "0.2.13"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.10.6"
pbkdf2 = "0.12.2"
qrcode = "0.14.1"
quick-xml = { version = "0.41.0", features = ["serialize"] }
regex = "1.13.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "form", "rustls"] }
rsa = { version = "0.9.10", features = ["pem"] }
rust_xlsxwriter = "0.96.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.10.7"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.52.3", features = ["full"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.4", features = ["v7", "serde"] }
walkdir = "2.5.0"
zip = "8.6.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
