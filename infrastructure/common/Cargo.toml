[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
cancellation = { path = "../cancellation" }
icu_casemap = "2.4.0"
icu_collator = "2.4.0"
icu_locale_core = "2.4.0"
futures-util = "0.3.34"
distributed_cache = { path = "../distributed_cache" }
distributed_lock = { path = "../distributed_lock" }
identifier_generator = { path = "../identifier_generator" }
source_generator_core = { path = "../../source_generator/source_generator_core" }
indexmap = "2.14.2"
rust_decimal = "1.43.0"

aes = "0.9.4"
aes-gcm = "0.11.1"
base64 = "0.23.1"
calamine = "0.38.0"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10.4"
ecb = "0.2.1"
flate2 = { version = "1.1.11", features = ["zlib-rs"] }
hmac = "0.13.0"
http = "1.5.0"
hostname = "0.4.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "ico", "gif", "webp"] }
md-5 = "0.11.0"
# RSA 0.9 的 Digest 接口仍基于 0.10 系列；兼容别名使用该系列最新版本。
md5_legacy = { package = "md-5", version = "0.10.6" }
pbkdf2 = "0.13.0"
qrcode = "0.14.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
regex = "1.13.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "form", "rustls", "stream"] }
rsa = { version = "0.9.10", features = ["pem"] }
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "arbitrary_precision"] }
sha1 = "0.11.0"
# 与 RSA 0.9 的 Digest 接口保持兼容。
sha1_legacy = { package = "sha1", version = "0.10.7" }
sha2 = "0.11.1"
# 与 RSA 0.9 的 Digest 接口保持兼容。
sha2_legacy = { package = "sha2", version = "0.10.9" }
skia-safe = { version = "0.157.0", default-features = false, features = ["binary-cache", "jpeg", "webp-decode"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
urlencoding = "2.1.3"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
walkdir = "2.5.0"
zip = "9.4.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
