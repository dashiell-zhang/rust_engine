[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
distributed_cache = { path = "../distributed_cache" }
distributed_lock = { path = "../distributed_lock" }
identifier_generator = { path = "../identifier_generator" }

aes = "0.9.0"
aes-gcm = "0.10.3"
base64 = "0.22.1"
calamine = "0.34.0"
chrono = { version = "0.4.44", features = ["clock", "serde"] }
ecb = "0.2.0"
flate2 = "1.1.9"
hostname = "0.4.2"
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.10.6"
pbkdf2 = "0.12.2"
qrcode = "0.14.1"
quick-xml = { version = "0.39.2", features = ["serialize"] }
regex = "1.12.3"
rand = "0.10.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "multipart", "form", "rustls"] }
rsa = { version = "0.9.10", features = ["pem"] }
rust_xlsxwriter = "0.94.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10.6"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.52.2", features = ["full"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.1", features = ["v7", "serde"] }
walkdir = "2.5.0"
zip = "8.6.0"
