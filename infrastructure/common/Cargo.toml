[package]
name = "common"
version = "0.1.0"
edition = "2024"

[features]
default = ["runtime"]
runtime = ["dep:distributed_cache", "dep:distributed_lock", "dep:identifier_generator", "dep:aes", "dep:aes-gcm", "dep:calamine", "dep:ecb", "dep:hmac", "dep:hostname", "dep:image", "dep:md-5", "dep:md5_legacy", "dep:pbkdf2", "dep:qrcode", "dep:quick-xml", "dep:rand", "dep:reqwest", "dep:rsa", "dep:rust_xlsxwriter", "dep:sha1", "dep:sha1_legacy", "dep:sha2", "dep:sha2_legacy", "dep:skia-safe", "dep:subtle", "dep:tokio", "dep:walkdir", "dep:zip"]

[dependencies]
cancellation = { path = "../cancellation" }
icu_casemap = "2.4.0"
icu_collator = "2.4.0"
icu_locale_core = "2.4.0"
futures-util = "0.3.34"
distributed_cache = { path = "../distributed_cache", optional = true }
distributed_lock = { path = "../distributed_lock", optional = true }
identifier_generator = { path = "../identifier_generator", optional = true }
source_generator_core = { path = "../../source_generator/source_generator_core" }
indexmap = "2.14.2"
rust_decimal = "1.43.0"

aes = { version = "0.9.4", optional = true }
aes-gcm = { version = "0.11.1", optional = true }
base64 = "0.23.1"
calamine = { version = "0.38.0", optional = true }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
chrono-tz = "0.10.4"
ecb = { version = "0.2.1", optional = true }
flate2 = { version = "1.1.11", features = ["zlib-rs"] }
hmac = { version = "0.13.0", optional = true }
http = "1.5.0"
hostname = { version = "0.4.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "ico", "gif", "webp"], optional = true }
md-5 = { version = "0.11.0", optional = true }
# RSA 0.9 的 Digest 接口仍基于 0.10 系列；兼容别名使用该系列最新版本。
md5_legacy = { package = "md-5", version = "0.10.6", optional = true }
pbkdf2 = { version = "0.13.0", optional = true }
qrcode = { version = "0.14.1", optional = true }
quick-xml = { version = "0.42.0", features = ["serialize"], optional = true }
regex = "1.13.1"
rand = { version = "0.10.3", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "form", "rustls", "stream"], optional = true }
rsa = { version = "0.9.10", features = ["pem"], optional = true }
rust_xlsxwriter = { version = "0.102.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value", "arbitrary_precision"] }
sha1 = { version = "0.11.0", optional = true }
# 与 RSA 0.9 的 Digest 接口保持兼容。
sha1_legacy = { package = "sha1", version = "0.10.7", optional = true }
sha2 = { version = "0.11.1", optional = true }
# 与 RSA 0.9 的 Digest 接口保持兼容。
sha2_legacy = { package = "sha2", version = "0.10.9", optional = true }
skia-safe = { version = "0.157.0", default-features = false, features = ["binary-cache", "jpeg", "webp-decode"], optional = true }
subtle = { version = "2.6.1", optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }
urlencoding = "2.1.3"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
walkdir = { version = "2.5.0", optional = true }
zip = { version = "9.4.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
