[package]
name = "sms_ali_cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
sms = { path = "../sms" }

async-trait = "0.1"
chrono = "0.4.45"
hmac = "0.13.0"
percent-encoding = "2.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11.0"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4"] }
