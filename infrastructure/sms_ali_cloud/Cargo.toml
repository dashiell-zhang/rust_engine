[package]
name = "sms_ali_cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
http_client = { path = "../http_client" }
common = { path = "../common" }
sms = { path = "../sms" }

async-trait = "0.1.92"
chrono = "0.4.45"
hmac = "0.13.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4"] }
