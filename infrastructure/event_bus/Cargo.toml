[package]
name = "event_bus"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
async-trait = "0.1.92"
futures-util = "0.3.34"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
