[package]
name = "webapi_core"
version = "0.1.0"
edition = "2024"

[dependencies]
application_service = { path = "../../application/application_service" }
application_interface = { path = "../../application/application_interface" }
application_model = { path = "../../application/application_model" }
common = { path = "../../infrastructure/common" }
distributed_cache = { path = "../../infrastructure/distributed_cache" }
distributed_lock = { path = "../../infrastructure/distributed_lock" }
identifier_generator = { path = "../../infrastructure/identifier_generator" }
logger = { path = "../../infrastructure/logger" }
llm = { path = "../../infrastructure/llm" }
repository = { path = "../../repository" }
source_generator_runtime = { path = "../../source_generator/source_generator_runtime" }

axum = { version = "0.8.9", features = ["multipart"] }
async-recursion = "1"
async-trait = "0.1"
base64 = "0.22.1"
chrono = "0.4.44"
config = "0.15.22"
dashmap = "6"
futures-util = "0.3"
hmac = "0.13.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
mime_guess = "2.0"
multer = "3"
pbkdf2 = "0.13.0"
p256 = { version = "0.13.2", features = ["pkcs8"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
sea-orm = { version = "1.1.20", features = [ "sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.52.1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1.44"
url = "2"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
