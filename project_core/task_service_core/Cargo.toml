[package]
name = "task_service_core"
version = "0.1.0"
edition = "2024"

[dependencies]
application_runtime = { path = "../../application/application_runtime" }
event_bus = { path = "../../infrastructure/event_bus" }
queue_task_database = { path = "../../infrastructure/queue_task_database" }
application_interface = { path = "../../application/application_interface" }
common = { path = "../../infrastructure/common" }
distributed_cache = { path = "../../infrastructure/distributed_cache" }
distributed_lock = { path = "../../infrastructure/distributed_lock" }
identifier_generator = { path = "../../infrastructure/identifier_generator" }
logger = { path = "../../infrastructure/logger" }
repository_core = { path = "../../infrastructure/repository_core" }
source_generator_runtime = { path = "../../source_generator/source_generator_runtime" }

async-trait = "0.1.92"
chrono = "0.4.45"
config = "0.15.27"
sea-orm = { version = "2.0.4", features = [ "sqlx-postgres", "runtime-tokio-rustls" ] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "time", "signal"] }
tracing = "0.1.44"

futures-util = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
