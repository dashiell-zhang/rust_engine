[lock]
component = "in_memory"
connection = "redis://:123456@127.0.0.1/0"
prefix = "admin_webapi"

[logger]
component = "local_file"
project = "admin_webapi"
save_days = 14

[logger.log_level]
default = "info"
"http.request" = "warning"

[file]
component = "local"
root_path = "presentation/admin_webapi/storage"
public_base_url = "http://127.0.0.1:3000"

[file.aliyun_oss]
region = ""
use_internal_endpoint = false
