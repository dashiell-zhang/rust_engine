[host]
listen_address = "0.0.0.0:3000"

[host.database_pool]
test_before_acquire = false
max_connections = 30
min_connections = 5
connect_timeout_seconds = 10
acquire_timeout_seconds = 5
idle_timeout_seconds = 300
max_lifetime_seconds = 1800
sqlx_logging = false

[database]
connection = "postgres://postgres:123456@127.0.0.1:5432/webcore"

[cors]
allowed_origin_list = [
	"*"
]

[jwt]
issuer = "*"
audience = "*"
private_key = "MHcCAQEEIM46BrFOgAQYogx27I1vhqUnoX7dy3NND/yNSIXl8OLDoAoGCCqGSM49AwEHoUQDQgAEWIDxFn39cqNZdikMuwqF097X8BlIejvhb7QMp3fzXeGY+kcd7oku0dOQB34e5uOhYiHtzkDM/k+xdubSpp0dNA=="
