region = ""
secret_id = ""
secret_key = ""
bucket_name = ""
endpoint = ""

[cache]
component = "in_memory"
connection = "redis://:123456@127.0.0.1/0"
prefix = "admin_webapi"

[sms_verify]
code_ttl_seconds = 300
resend_interval_seconds = 60
queue_task_name = "System.Queue.SendSms"
