[package]
name = "client_webapi"
version = "0.1.0"
edition = "2024"

[dependencies]
email = { path = "../../infrastructure/email" }
file_storage = { path = "../../infrastructure/file_storage", default-features = false }
http_client = { path = "../../infrastructure/http_client" }
application_runtime = { path = "../../application/application_runtime" }
source_generator_runtime = { path = "../../source_generator/source_generator_runtime" }
webapi_support = { path = "../webapi_support", features = ["llm"] }
event_bus = { path = "../../infrastructure/event_bus" }
event_bus_redis = { path = "../../infrastructure/event_bus_redis" }
event_bus_database = { path = "../../infrastructure/event_bus_database" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
webapi_core = { path = "../../project_core/webapi_core" }
application_service = { path = "../../application/application_service" }
application_service_llm = { path = "../../application/application_service_llm" }
application_model = { path = "../../application/application_model" }
application_interface = { path = "../../application/application_interface" }
distributed_cache = { path = "../../infrastructure/distributed_cache" }
distributed_cache_memory = { path = "../../infrastructure/distributed_cache_memory" }
distributed_cache_redis = { path = "../../infrastructure/distributed_cache_redis" }
distributed_lock = { path = "../../infrastructure/distributed_lock" }
distributed_lock_memory = { path = "../../infrastructure/distributed_lock_memory" }
distributed_lock_redis = { path = "../../infrastructure/distributed_lock_redis" }
email_smtp = { path = "../../infrastructure/email_smtp" }
file_storage_ali_cloud = { path = "../../infrastructure/file_storage_ali_cloud" }
file_storage_tencent_cloud = { path = "../../infrastructure/file_storage_tencent_cloud" }
logger = { path = "../../infrastructure/logger" }
logger_database = { path = "../../infrastructure/logger_database" }
logger_local_file = { path = "../../infrastructure/logger_local_file" }
llm = { path = "../../infrastructure/llm" }

common = { path = "../../infrastructure/common" }

axum = { version = "0.8.9", features = ["multipart"] }
async-trait = "0.1.92"
http = "1.5.0"
openssl = { version = "0.10.82", features = ["vendored"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "stream"] }
sha2 = "0.11.1"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
uuid = "1.29.0"
